; ES3C28P - ESP32-S3, LCD ILI9341V 240x320 SPI, tactil FT6336 I2C
; Pinout: https://github.com/ngttai/esp32_s3_es3c28p
; Para flashear: si esptool dice "No serial data received" o "Device not
; configured", la app tiene tomado el USB-CDC y la placa no entra sola en modo
; descarga. Manten BOOT, pulsa y suelta RESET, suelta BOOT, y reintenta.
[env:es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_src_filter = +<main.cpp>

lib_deps = bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI se configura entero desde aqui: no hay que tocar User_Setup.h
; dentro de .pio/ (se borra en cada pio pkg update).
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSE_FSPI_PORT=1      ; sin esto SPI_PORT=FSPI=0 en el S3 y REG_SPI_BASE(0)=0 => crash
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_INVERSION_ON=1   ; este panel es IPS: sin esto sale todo en negativo
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_MISO=13
  -DTFT_CS=10
  -DTFT_DC=46
  -DTFT_RST=-1          ; comparte el reset del ESP32-S3
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000

; Sonda de hardware, no es el firmware. pio run -e probe -t upload
[env:probe]
extends = env:es3c28p
build_src_filter = +<probe.cpp>
